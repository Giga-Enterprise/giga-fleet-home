<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="512" viewBox="0 0 265 128">
  <style>
    .dot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: dotIn .22s ease-out forwards; }
    .dot-1 { animation-delay: .25s; }
    .dot-2 { animation-delay: .55s; }
    .dot-3 { animation-delay: .85s; }
    .dot-4 { animation-delay: 1.15s; }
    .connector { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .3s ease-out forwards; }
    .connector-1 { animation-delay: .48s; }
    .connector-2 { animation-delay: .78s; }
    .connector-3 { animation-delay: 1.08s; }
    .arrow-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .5s ease-out forwards; animation-delay: 1.38s; }
    .arrow-head { opacity: 0; animation: fadeIn .18s ease-out forwards; animation-delay: 1.82s; }
    @keyframes dotIn {
      from { opacity: 0; transform: scale(.35); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
  <rect x="3.25" y="3.25" width="258.5" height="121.5" rx="23" fill="#E4EDF5" stroke="#102A43" stroke-width="6.5"/>
  <text x="175" y="42" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="34" font-weight="500" letter-spacing=".2" text-anchor="middle" fill="#102A43">GIGA</text>
  <text x="175" y="62" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.7" text-anchor="middle" fill="#102A43">ENTERPRISES</text>
  <text x="133" y="107" font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif" font-size="8" font-weight="700" letter-spacing=".5" text-anchor="middle" fill="#DA7101">PLATFORMS • CONNECTED OPS</text>
  <line class="connector connector-1" x1="30" y1="46" x2="54" y2="27" pathLength="1" stroke="#102A43" stroke-width="4.5" stroke-linecap="round"/>
  <line class="connector connector-2" x1="54" y1="27" x2="78" y2="52" pathLength="1" stroke="#102A43" stroke-width="4.5" stroke-linecap="round"/>
  <line class="connector connector-3" x1="78" y1="52" x2="113" y2="78" pathLength="1" stroke="#102A43" stroke-width="4.5" stroke-linecap="round"/>
  <circle class="dot dot-1" cx="30" cy="46" r="6.4" fill="#4E8A2C"/>
  <circle class="dot dot-2" cx="54" cy="27" r="6.4" fill="#4E8A2C"/>
  <circle class="dot dot-3" cx="78" cy="52" r="6.4" fill="#4E8A2C"/>
  <circle class="dot dot-4" cx="113" cy="78" r="6.4" fill="#4E8A2C"/>
  <line class="arrow-line" x1="122" y1="78" x2="230" y2="78" pathLength="1" stroke="#DA7101" stroke-width="4.6" stroke-linecap="round"/>
  <polygon class="arrow-head" points="227,67 243,78 227,89" fill="#DA7101"/>
</svg>
